<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Your Town</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="story-container" class="overlay">
        <img id="story-image" src="" alt="story frame">
        <p id="story-text"></p>
        <button id="next-story">Next</button>
    </div>

    <div id="game-container" class="hidden">
        <header>
            <div id="level">Level 1</div>
            <div id="stats">
                <div id="username-wrap">
                    <span id="username">Mayor</span>
                    <button id="edit-username" type="button" aria-label="Edit username" title="Edit username">✏️</button>
                </div>
                <span id="money">$100</span>
                <span id="gems">💎 0</span>
                <span id="population">20 ppl</span>
            </div>
        </header>
        <div id="town-view">
            <!-- buildings will appear here -->
        </div>
        <footer>
            <button id="store-button" aria-label="Open Store">S</button>
            <select id="building-type" aria-label="Building type"></select>
            <button id="build-button">Build</button>
        </footer>

        <div id="store-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Town store">
            <div class="store-panel">
                <div class="store-head">
                    <h2>Town Store</h2>
                    <button id="store-close" aria-label="Close store">✕</button>
                </div>
                <div class="store-tabs">
                    <button id="store-buildings-tab" class="active">Buildings</button>
                    <button id="store-gems-tab">💎 Gems</button>
                </div>
                <div id="store-content"></div>
            </div>
        </div>
    </div>

    <script src="bundle.js"></script>
</body>
</html>
