<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Your Town</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="story-container" class="overlay">
        <img id="story-image" src="" alt="story frame">
        <p id="story-text"></p>
        <button id="next-story">Next</button>
    </div>

    <div id="game-container" class="hidden">
        <header>
            <div id="stats">
                <span id="money">$100</span>
                <span id="population">20 ppl</span>
            </div>
        </header>
        <div id="town-view">
            <!-- buildings will appear here -->
        </div>
        <footer>
            <select id="building-type" aria-label="Building type"></select>
            <button id="build-button">Build</button>
        </footer>
    </div>

    <script src="bundle.js"></script>
</body>
</html>
