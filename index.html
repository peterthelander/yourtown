<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Town</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="story-container" class="overlay">
        <img id="story-image" src="" alt="story frame">
        <p id="story-text"></p>
        <button id="next-story">Next</button>
    </div>

    <div id="game-container" class="hidden">
        <header>
            <div id="stats">
                <span id="money">$100</span>
                <span id="population">20 ppl</span>
            </div>
        </header>
        <div id="town-view">
            <!-- buildings will appear here -->
        </div>
        <footer>
            <button class="build-btn" data-type="house">House ($50)</button>
            <button class="build-btn" data-type="library">Library ($100)</button>
            <button class="build-btn" data-type="workplace">Workplace ($80)</button>
            <button class="build-btn" data-type="school">School ($120)</button>
            <button class="build-btn" data-type="gym">Gym ($70)</button>
            <button class="build-btn" data-type="grocery">Grocery ($60)</button>
        </footer>
    </div>

    <script src="bundle.js"></script>
</body>
</html>
